# SignalDesk — production stack
#   cp .env.example .env   (fill in the secrets)
#   docker compose up -d --build
#   docker compose --profile tls up -d --build      # + automatic HTTPS via Caddy (needs DOMAIN)
# Demo on historical data: see deploy/docker-compose.demo.yml

name: signaldesk

x-backend: &backend
  image: signaldesk-backend:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-signals}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-signals}
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-signals}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # one-shot: apply database migrations before the API and engine start
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  engine:
    <<: *backend
    command: ["python", "-m", "app.engine"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 20s

  web:
    image: signaldesk-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      SEARCH_INDEXING: ${SEARCH_INDEXING:-false}
      API_UPSTREAM: api:8000
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # optional: automatic HTTPS (Let's Encrypt) in front of `web`
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
