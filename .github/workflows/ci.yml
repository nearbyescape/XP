name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signals
          POSTGRES_PASSWORD: signals
          POSTGRES_DB: signals
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signals" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Research-parity and replay tests need research/data/parquet (python research/data/fetch_klines.py);
      # they are skipped here and run locally before changing strategy code.
      - run: pytest -q -rs
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://signals:signals@localhost:5432/signals
        run: alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: CI environment
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke test (API, web, search-engine blocking)
        run: |
          docker compose up -d --wait db api web
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsSI http://127.0.0.1:8080/ | grep -i "^x-robots-tag: noindex"
          curl -fsS -o /dev/null -D - http://127.0.0.1:8080/api/health | grep -i "^x-robots-tag: noindex"
          # private site (default): the dashboard's data needs the admin login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/meta)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/signals)" = "401"
          curl -fsS http://127.0.0.1:8080/robots.txt | grep -qx "Disallow: /"
          curl -fsS http://127.0.0.1:8080/ | grep -q 'name="robots" content="noindex'
      - name: Website proxy follows a recreated API container (new address, as after every update)
        run: |
          addr() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -aq api)"; }
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q api)")
          before=$(addr)
          docker compose stop api
          # take the freed addresses (the API's and the finished migrate job's) so the new API gets another
          for n in 1 2 3; do docker run -d --name "ip-holder-$n" --network "$net" busybox:1.36 sleep 600; done
          docker compose up -d --wait --no-deps --force-recreate api
          after=$(addr)
          echo "API address $before -> $after"
          test "$before" != "$after"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          echo "web still proxies to the old API address"; exit 1
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: |
          docker rm -f ip-holder-1 ip-holder-2 ip-holder-3 || true
          docker compose down -v
